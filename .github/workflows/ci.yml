name: CampusFlow CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  # ============================================================================
  # JOB 1: Backend Tests & Migration Validation
  # ============================================================================
  backend-tests:
    name: Backend Tests & Migrations
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: campusflow
          POSTGRES_PASSWORD: campusflow_dev
          POSTGRES_DB: campusflow_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U campusflow -d campusflow_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: testing
      DATABASE_URL: postgresql+asyncpg://campusflow:campusflow_dev@localhost:5432/campusflow_dev
      JWT_KEY_ID: campusflow-dev-key-v1
      JWT_PRIVATE_KEY_BASE64: ""
      JWT_PUBLIC_KEY_BASE64: ""
      STORAGE_PROVIDER: mock
      NOTIFICATION_TASK_PROVIDER: mock
      PUSH_PROVIDER: mock
      EMAIL_PROVIDER: mock

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Validate Alembic Migrations
        run: |
          cd backend
          echo "Applying migrations to CI PostgreSQL database..."
          alembic upgrade head
          
          echo "Verifying migration heads..."
          HEADS=$(alembic heads)
          echo "$HEADS"
          
          echo "$HEADS" | grep -q "0007_audit_logs_immutability (head)" || {
            echo "Error: Expected head 0007_audit_logs_immutability not found"
            exit 1
          }
          
          HEAD_COUNT=$(echo "$HEADS" | grep -c "(head)")
          if [ "$HEAD_COUNT" -ne 1 ]; then
            echo "Error: Multiple Alembic heads detected ($HEAD_COUNT)"
            exit 1
          fi
          echo "Alembic migrations verified: exactly 1 head (0007_audit_logs_immutability)"

      - name: Run Complete Backend Pytest Suite
        run: |
          cd backend
          pytest -v

  # ============================================================================
  # JOB 2: Frontend Production Build
  # ============================================================================
  frontend-build:
    name: Frontend Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Frontend Bundle
        run: |
          cd frontend
          npm run build

  # ============================================================================
  # JOB 3: Docker Build & Compose Validation
  # ============================================================================
  docker-build:
    name: Docker Build & Compose Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config --quiet
          echo "docker-compose.yml configuration syntax and topology are valid."

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: campusflow-backend:ci
          load: true

      - name: Verify Backend Non-Root User
        run: |
          USER_ID=$(docker run --rm --entrypoint="" campusflow-backend:ci id -u)
          echo "Backend Container Runtime User ID: $USER_ID"
          if [ "$USER_ID" -ne 10001 ]; then
            echo "Security check failed: Backend must run as non-root UID 10001"
            exit 1
          fi

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          build-args: |
            VITE_API_URL=/api/v1
          push: false
          tags: campusflow-frontend:ci
          load: true

      - name: Verify Frontend Non-Root User
        run: |
          USER_NAME=$(docker run --rm campusflow-frontend:ci whoami)
          echo "Frontend Container Runtime User: $USER_NAME"
          if [ "$USER_NAME" != "nginx" ]; then
            echo "Security check failed: Frontend must run as non-root user nginx"
            exit 1
          fi
