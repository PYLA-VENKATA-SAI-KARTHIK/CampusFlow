# ==============================================================================
# CampusFlow — Render Deployment Blueprint
# Automated deployment for Backend (FastAPI), Frontend (Vite SPA), and PostgreSQL
# ==============================================================================

databases:
  - name: campusflow-db
    databaseName: campusflow
    user: campusflow
    plan: free
    region: oregon

services:
  # ----------------------------------------------------------------------------
  # 1. FastAPI Backend Web Service
  # ----------------------------------------------------------------------------
  - type: web
    name: campusflow-api
    runtime: python
    rootDir: backend
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: false
      - key: DATABASE_URL
        fromDatabase:
          name: campusflow-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: http://localhost:5173,https://kare-placements.onrender.com,https://campusflow-web.onrender.com
      - key: FRONTEND_BASE_URL
        value: https://kare-placements.onrender.com
      - key: JWT_KEY_ID
        value: campusflow-prod-v1
      - key: JWT_ACCESS_TOKEN_EXPIRE_SECONDS
        value: 900
      - key: JWT_REFRESH_TOKEN_EXPIRE_SECONDS
        value: 604800
      - key: JWT_ISSUER
        value: https://campusflow-api.onrender.com
      - key: JWT_PRIVATE_KEY_BASE64
        sync: false
      - key: JWT_PUBLIC_KEY_BASE64
        sync: false
      - key: EMAIL_PROVIDER
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_FROM_NAME
        value: CampusFlow Placements
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        value: onboarding@resend.dev
      - key: SENDGRID_API_KEY
        sync: false
      - key: BREVO_API_KEY
        sync: false

  # ----------------------------------------------------------------------------
  # 2. React / Vite Frontend Static Site
  # ----------------------------------------------------------------------------
  - type: web
    name: kare-placements
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://campusflow-api.onrender.com/api/v1

