# ==============================================================================
# CampusFlow — Local Multi-Service Environment (Docker Compose)
# LOCAL DEVELOPMENT AND TEST PURPOSES ONLY.
# NOT A PRODUCTION ARCHITECTURE.
# ==============================================================================

version: "3.8"

services:
  # ----------------------------------------------------------------------------
  # 1. PostgreSQL Database Service
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: campusflow-postgres
    environment:
      POSTGRES_USER: campusflow
      POSTGRES_PASSWORD: campusflow_dev
      POSTGRES_DB: campusflow_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campusflow -d campusflow_dev"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - campusflow-network

  # ----------------------------------------------------------------------------
  # 2. FastAPI Backend Service (Uvicorn / Python 3.13)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: campusflow-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://campusflow:campusflow_dev@postgres:5432/campusflow_dev
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173,http://localhost:8080
      INTERNAL_SERVICE_URL: http://backend:8000
      INTERNAL_TASK_AUTH_SECRET: campusflow-internal-tasks-secret-dev
      STORAGE_PROVIDER: mock
      NOTIFICATION_TASK_PROVIDER: mock
      PUSH_PROVIDER: mock
      EMAIL_PROVIDER: mock
      RUN_MIGRATIONS: "true"
      JWT_KEY_ID: campusflow-dev-key-v1
      JWT_PRIVATE_KEY_BASE64: 
      JWT_PUBLIC_KEY_BASE64: 
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - campusflow-network

  # ----------------------------------------------------------------------------
  # 3. React Frontend Service (Nginx / Non-Root)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api/v1
    container_name: campusflow-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/nginx-health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - campusflow-network

# ------------------------------------------------------------------------------
# Volumes & Networks
# ------------------------------------------------------------------------------
volumes:
  postgres_data:
    driver: local

networks:
  campusflow-network:
    driver: bridge
